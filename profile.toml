[metrics]
# Languages from repos you own (forks excluded). Private repos are only counted
# when this is true AND the token can see them (a PAT in METRICS_TOKEN).
include_private_languages = false
exclude_languages = ["Jupyter Notebook", "Jinja", "Mako", "Edge", "Procfile"]
languages_count   = 8


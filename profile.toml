# ── Color scheme: "Aurora Circuit" ──────────────────────────────────────────
[theme]
bg       = "#070B12"   # deepest background
surface  = "#0B111B"   # card fill
raised   = "#111A27"   # title bars, empty cells
border   = "#1E2B3C"
grid     = "#15233A"
text     = "#E8F0F8"
text_dim = "#A9B8C8"
muted    = "#6B7D91"
ink      = "#04121A"   # dark text on bright fills
mint     = "#00F5A0"
cyan     = "#00D9F5"
azure    = "#3D8BFF"
violet   = "#A78BFA"
rose     = "#FF5C8A"
amber    = "#FFB547"
# Signature gradient (header name, borders, dividers) and chart series order.
gradient = ["#00F5A0", "#00D9F5", "#3D8BFF"]
series   = ["#00F5A0", "#00D9F5", "#3D8BFF", "#A78BFA", "#FF5C8A", "#FFB547", "#5EEAD4", "#93C5FD"]

# ─────────────────────────────────────────────────────────────────────────────
#  Profile config — the single source of truth for the profile artwork.
#
#  Static art  (header, terminal, section titles, project cards, footer):
#      python3 scripts/build_assets.py            → writes ./assets/*.svg
#  Live stats  (stats, streak, languages, weekday, activity, trophies, quote):
#      GITHUB_TOKEN=... python3 scripts/build_metrics.py --out dist
#      (run daily by .github/workflows/profile-metrics.yml → `output` branch)
#
#  Changing the palette below recolors every generated SVG. The badge URLs in
#  README.md (shields.io / komarev / skillicons) use the same hex values, so
#  search-and-replace them there if you change the core colors.
# ─────────────────────────────────────────────────────────────────────────────

